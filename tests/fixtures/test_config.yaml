io:
  epoch_dir: "__EPOCH_DIR__"
  epoch_pattern: "{subject}_task-diapix_run-{run}_epo.fif"
  out_dir: "__OUT_DIR__"

dataset:
  subjects:
    mode: "explicit"
    exclude: []
    include: ["sub-006"]
  tasks: ["diapix"]
  runs: [1]
  invalid_subject_run: []

constraints:
  min_latency: -1.0
  max_latency: 1.0
  min_response_duration: 0.01

analysis:
  contrasts: ["duration", "latency"]
  bands: ["alpha", "beta"]
  erp:
    left_margin: 0.0
    right_margin: 0.0
    baseline: [-0.2, 0.0]
    sfreq: 64
    n_permutations: 10
    threshold: null
    artifacts:
      duration:
        long: "erp/duration/long_ave.fif"
        short: "erp/duration/short_ave.fif"
      latency:
        fast: "erp/latency/fast_ave.fif"
        slow: "erp/latency/slow_ave.fif"
  tfr:
    left_margin: 0.0
    right_margin: 0.0
    method: "hilbert"
    sfreq: 64
    n_permutations: 10
    threshold: null
  mixed:
    tw1: [-0.2, -0.1]
    tw2: [-0.1, 0.0]
    baseline: [-0.3, -0.2]
    selection:
      min_latency: -1.0
      max_latency: 1.0
      min_self_duration: 0.01
  decoding:
    sfreq: 64
    n_splits: 2

execution:
  threads_light: 1
  threads_heavy: 1
  mem_mb_light: 256
  mem_mb_heavy: 512

viz:
  erp_timecourse:
    xlim_ms: [-500, 500]
    ylim_uv: [-5, 5]
  behavior:
    n_bins: 10
  erp_topo:
    tmin_s: -0.2
    tmax_s: 0.1
    step_ms: 50
  erp_topomaps: {}
  tfr_topomaps: {}
  tfr_topos:
    tmin_s: -0.2
    tmax_s: 0.1
    step_ms: 50
  decoding:
    figure_profile: "jneuro_2col"
    p_threshold: 0.01
    ymax: 0.65
    lim: 0.04
  erp_hist:
    xlim_ms: [-500, 500]
    ylim_uv: [-5, 5]
