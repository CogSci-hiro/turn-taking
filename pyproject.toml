[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "turntaking"
version = "0.0.0"
description = "Turn-taking analysis package (skeleton)"
requires-python = ">=3.10"

dependencies = [
  "h5py",
  "mne",
  "numpy",
  "pandas",
  "pyarrow >= 14.0",
  "seaborn",
  "cairosvg",
  "pillow"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
docs = [
  "sphinx>=7.0",
  "pydata-sphinx-theme>=0.14.0",
  "numpydoc>=1.6.0",
  "sphinx-design>=0.5.0",
  "sphinx-copybutton>=0.5.0",
  "sphinxcontrib-mermaid>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: fast unit tests",
  "contract: repository and pipeline contracts",
  "integration: end-to-end tests",
]
norecursedirs = [".git", ".venv", ".snakemake", "__pycache__", "tests/fixtures/_tmp_out"]
