paths:
  workdir: "/Users/hiro/PycharmProjects/turn-taking-working"
  epoch_dir: "/Volumes/work-4T/hyperscanning/derived/eeg/epochs"
  beh_dir: "/Volumes/work-4T/hyperscanning/derived/beh/metadata_wide_window"
  out_dir: "/Volumes/work-4T/turn-taking-new"
io:
  epoch_dir: "/Volumes/work-4T/hyperscanning/derived/eeg/epochs"
  epoch_pattern: "{subject}_task-{task}_run-{run}_epochs-epo.fif"
  out_dir: "/Volumes/work-4T/turn-taking-new"
dataset:
  subjects:
    mode: "from_epochs"
    exclude:
    - "sub-001"
    - "sub-002"
    - "sub-003"
    - "sub-032"
    include: []
  tasks:
  - "conversation"
  runs:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  invalid_subject_run:
  - - "sub-004"
    - '1'
  - - "sub-004"
    - '2'
  - - "sub-027"
    - '8'
  - - "sub-028"
    - '8'
  - - "sub-015"
    - '3'
constraints:
  min_latency: -1.0
  max_latency: 1.0
  min_response_duration: 0.01
analysis:
  contrasts:
  - "duration"
  - "latency"
  bands:
  - "alpha"
  - "beta"
  erp:
    left_margin: 0.2
    right_margin: 0.5
    sfreq: 512
    n_permutations: 1000
    threshold: null
  tfr:
    left_margin: 0.2
    right_margin: 0.5
    method: "hilbert"
    sfreq: 512
    n_permutations: 1000
    threshold: null
  mixed:
    tw1: [-1.3, -0.8]
    tw2: [-0.7, 0.0]
    baseline: [-2, 0.0]
    selection:
      min_latency: 0.05
      max_latency: 2.0
      min_self_duration: 0.10
  decoding:
    sfreq: 64
    n_splits: 10
    seed: 0              # for deterministic CV splits
    cache_features: false

    n_permutations: 1000
    threshold: null
    tail: 1
    chance_level: 0.5
    n_jobs: 10   # optional; if omitted, fallback to analysis.decoding.n_jobs

    cache:
      format: "hdf5"     # only used if cache_features: true
      compression: "gzip"
      compression_level: 4
      dtype: "float32"   # store X as float32 to reduce footprint
    diag:
      left_margin: 0.2
      right_margin: 0.5
    tg:
      left_margin: 0.2
      right_margin: 0.5

execution:
  threads_light: 1
  threads_heavy: 10
  mem_mb_light: 1000
  mem_mb_heavy: 10000

viz:
  erp_timecourse:
    duration_long_fif: "/Volumes/work-4T/turn-taking-new/erp/duration/long_ave.fif"
    duration_short_fif: "/Volumes/work-4T/turn-taking-new/erp/duration/short_ave.fif"
    latency_fast_fif: "/Volumes/work-4T/turn-taking-new/erp/latency/fast_ave.fif"
    latency_slow_fif: "/Volumes/work-4T/turn-taking-new/erp/latency/slow_ave.fif"
    out_base: "/Volumes/work-4T/turn-taking-new/figures/main/F_erp_timecourse.tif"
    xlim_ms: [-1500, 500]
    ylim_uv: [-2.8, 1.9]
  behavior:
    duration_offsets_csv: "/Volumes/work-4T/turn-taking-new/erp/duration/offsets.csv"
    latency_offsets_csv: "/Volumes/work-4T/turn-taking-new/erp/latency/offsets.csv"
    turn_table_csv: "/Volumes/work-4T/turn-taking-new/beh/turn_table.csv"
    out_base: "/Volumes/work-4T/turn-taking-new/figures/F_behavior"
    n_bins: 100
  erp_topo:
    duration_cluster_hdf5: "/Volumes/work-4T/turn-taking-new/stats/erp/duration/cluster_results.hdf5"
    latency_cluster_hdf5: "/Volumes/work-4T/turn-taking-new/stats/erp/latency/cluster_results.hdf5"
    info_source_fif: "/Volumes/work-4T/turn-taking-new/erp/duration/difference_ave.fif"
    out_duration: "/Volumes/work-4T/turn-taking-new/figures/supp/F_erp_topo_duration.tif"
    out_latency: "/Volumes/work-4T/turn-taking-new/figures/supp/F_erp_topo_latency.tif"
    tmin_s: -2
    tmax_s: 0
    step_ms: 100          # pick e.g. 50 or 100
    max_cols: 10          # optional
    p_threshold: 0.01
  tfr_topos:
    alpha_duration_cluster_hdf5: "/Volumes/work-4T/turn-taking-new/stats/tfr/duration/alpha/cluster_results.hdf5"
    alpha_latency_cluster_hdf5:  "/Volumes/work-4T/turn-taking-new/stats/tfr/latency/alpha/cluster_results.hdf5"
    beta_duration_cluster_hdf5:  "/Volumes/work-4T/turn-taking-new/stats/tfr/duration/beta/cluster_results.hdf5"
    beta_latency_cluster_hdf5:   "/Volumes/work-4T/turn-taking-new/stats/tfr/latency/beta/cluster_results.hdf5"

    info_source_fif: "/Volumes/work-4T/turn-taking-new/erp/duration/difference_ave.fif"

    out_alpha_duration: "/Volumes/work-4T/turn-taking-new/figures/supp/F_tfr_topo_alpha_duration.tif"
    out_alpha_latency:  "/Volumes/work-4T/turn-taking-new/figures/supp/F_tfr_topo_alpha_latency.tif"
    out_beta_duration:  "/Volumes/work-4T/turn-taking-new/figures/supp/F_tfr_topo_beta_duration.tif"
    out_beta_latency:   "/Volumes/work-4T/turn-taking-new/figures/supp/F_tfr_topo_beta_latency.tif"

    tmin_s: -2
    tmax_s: 0
    step_ms: 100
    max_cols: 10
    p_threshold: 0.01
  decoding:
    duration_scores_npy: "/Volumes/work-4T/turn-taking-new/decoding/erp/duration/scores.npy"
    duration_times_npy: "/Volumes/work-4T/turn-taking-new/decoding/erp/duration/times.npy"
    latency_scores_npy: "/Volumes/work-4T/turn-taking-new/decoding/erp/latency/scores.npy"
    latency_times_npy: "/Volumes/work-4T/turn-taking-new/decoding/erp/latency/times.npy"
    duration_cluster_hdf5: "/Volumes/work-4T/turn-taking-new/stats/decoding/erp/duration/cluster_results.hdf5"
    latency_cluster_hdf5: "/Volumes/work-4T/turn-taking-new/stats/decoding/erp/latency/cluster_results.hdf5"

    out_base: "/Volumes/work-4T/turn-taking-new/figures/main/F_decoding"
    p_threshold: 0.05
    figure_profile: "jneuro_2col"
    ymax: 0.65
    lim: 0.04
  erp_topomaps:
    template_svg: "workflow/templates/ERP-timeline.svg"
    info_source_fif: "/Volumes/work-4T/turn-taking-new/erp/duration/difference_ave.fif"
    duration_cluster_hdf5: "/Volumes/work-4T/turn-taking-new/stats/erp/duration/cluster_results.hdf5"
    latency_cluster_hdf5: "/Volumes/work-4T/turn-taking-new/stats/erp/latency/cluster_results.hdf5"
    p_threshold: 0.05
    n_duration_maps: 2
    n_latency_maps: 3
  tfr_topomaps:
    template_svg: "workflow/templates/TF-timeline.svg"
    info_source_fif: "/Volumes/work-4T/turn-taking-new/tfr/duration/alpha/difference_ave.fif"
    alpha_cluster_hdf5: "/Volumes/work-4T/turn-taking-new/stats/tfr/duration/alpha/cluster_results.hdf5"
    beta_cluster_hdf5: "/Volumes/work-4T/turn-taking-new/stats/tfr/duration/beta/cluster_results.hdf5"
    p_threshold: 0.05
    n_duration_maps: 2
    n_latency_maps: 3