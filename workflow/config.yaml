paths:
  workdir: "/Users/hiro/PycharmProjects/turn-taking-working"
  epoch_dir: "/Volumes/work-4T/hyperscanning/derived/eeg/epochs"
  epoch_pattern: "{subject}_task-{task}_run-{run}_epochs-epo.fif"
  beh_dir: "/Volumes/work-4T/hyperscanning/derived/beh/metadata_wide_window"
  out_dir: "/Volumes/work-4T/turn-taking-testing"
dataset:
  subjects:
    mode: "from_epochs"
    exclude:
    - "sub-001"
    - "sub-002"
    - "sub-003"
    - "sub-032"
    include: []
  tasks:
  - "conversation"
  runs:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  invalid_subject_run:
  - - "sub-004"
    - 1
  - - "sub-004"
    - 2
  - - "sub-027"
    - 8
  - - "sub-028"
    - 8
  - - "sub-015"
    - 3
constraints:
  min_latency: -1.0
  max_latency: 1.0
analysis:
  contrasts:
  - "duration"
  - "latency"
  bands:
  - "alpha"
  - "beta"
  erp:
    baseline: [-2, 0.0]
    sfreq: 512
    n_permutations: 1000
    threshold:
      type: automatic
    artifacts:
      duration:
        long: "erp/duration/long_ave.fif"
        short: "erp/duration/short_ave.fif"
      latency:
        fast: "erp/latency/fast_ave.fif"
        slow: "erp/latency/slow_ave.fif"
  tfr:
    left_margin: 0.2
    right_margin: 0.5
    method: "hilbert"
    sfreq: 512
    n_permutations: 1000
    threshold: null
  mixed:
    tw1: [-1.3, -0.7]
    tw2: [-0.7, 0.0]
    baseline: [-2, 0.0]
    selection:
      min_latency: -1.0
      max_latency: 1.0
      min_self_duration: 0.01
  decoding:
    sfreq: 64
    n_splits: 10
    seed: 0              # for deterministic CV splits
    cache_features: false

    n_permutations: 1000
    threshold: null
    tail: 1
    chance_level: 0.5
    n_jobs: 10   # optional; if omitted, fallback to analysis.decoding.n_jobs

    cache:
      format: "hdf5"     # only used if cache_features: true
      compression: "gzip"
      compression_level: 4
      dtype: "float32"   # store X as float32 to reduce footprint
    diag:
      left_margin: 0.2
      right_margin: 0.5
    tg:
      left_margin: 0.2
      right_margin: 0.5

execution:
  threads_light: 1
  threads_heavy: 10
  mem_mb_light: 1000
  mem_mb_heavy: 10000

viz:
  erp_timecourse:
    xlim_ms: [-1500, 500]
    ylim_uv: [-2.8, 1.9]
  behavior:
    n_bins: 100
  topomaps:
    erp:
      static:
        tmin_s: -2
        tmax_s: 0
        step_ms: 100
        max_cols: 10
        p_threshold: 0.01
      svg:
        p_threshold: 0.05
        n_duration_maps: 2
        n_latency_maps: 3
    tfr:
      static:
        tmin_s: -2
        tmax_s: 0
        step_ms: 100
        max_cols: 10
        p_threshold: 0.01
      svg:
        p_threshold: 0.05
        n_duration_maps: 2
        n_latency_maps: 3
  decoding:
    p_threshold: 0.05
    figure_profile: "jneuro_2col"
    ymax: 0.65
    lim: 0.04
  erp_hist:
    xlim_ms: [ -1500, 500 ]
    ylim_uv: [ -2.8, 1.9 ]

input_csv: "dev/temp/table.csv"
fallback_input_csv:
  - "/mnt/data/table.csv"
  - "tests/fixtures/expected/mixed_effect/table.csv"
# Optional override for minimal-model test outputs.
# Defaults to: paths.out_dir/mixed_effect
# minimal_model_out_dir: "/path/to/output/mixed_effect"
use_raw: false
